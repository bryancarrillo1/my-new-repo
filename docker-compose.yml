# Local stand-ins for the cloud pieces in PROJECT_OVERVIEW.md:
#   Postgres  -> metadata, status, outbox
#   SeaweedFS -> S3 (originals + renditions); any S3-compatible server works
#   ElasticMQ -> SQS (job queue + dead-letter queue)
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: vpp
      POSTGRES_PASSWORD: vpp
      POSTGRES_DB: vpp
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vpp -d vpp"]
      interval: 2s
      retries: 30

  s3:
    image: chrislusf/seaweedfs:4.48
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports: ["8333:8333"]
    volumes:
      - s3data:/data
      - ./infra/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/healthz"]
      interval: 2s
      retries: 60

  elasticmq:
    image: softwaremill/elasticmq-native:1.6.14
    ports: ["9324:9324", "9325:9325"]
    volumes: ["./infra/elasticmq.conf:/opt/elasticmq.conf:ro"]

volumes:
  pgdata:
  s3data:
