include classpath("application.conf")

# The queue is a delivery mechanism, not the source of truth: messages carry a
# jobId and the worker re-reads the job row in Postgres. The DLQ is a backstop
# for poison messages; the authoritative retry count lives in processing_jobs.
queues {
  jobs {
    defaultVisibilityTimeout = 60 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue {
      name = "jobs-dlq"
      maxReceiveCount = 8
    }
  }
  jobs-dlq { }
}
